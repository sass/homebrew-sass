name: Testing of Homebrew recipes

on:
  push:
    branches: [main, feature.*]
    tags: ['**']
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Verify ${{ matrix.recipe }}"

    runs-on: macos-latest
    env: {HOMEBREW_NO_INSTALL_CLEANUP: 1}

    strategy:
      fail-fast: false
      matrix:
        recipe:
          - sass
          - migrator

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: brew update
      - run: brew tap-new sass/sass
      - run: brew --repository sass/sass
      - run: |
          path="$(brew --repository sass/sass)"
          rm -rf "$path"
          ln -s "$(pwd)" "$path"
      # TODO: Add --online once https://github.com/Homebrew/brew/pull/16626 is fixed
      - run: brew audit --strict --git "sass/sass/$RECIPE"
        env: {RECIPE: "${{ matrix.recipe }}"}
      - run: brew install "sass/sass/$RECIPE"
        env: {RECIPE: "${{ matrix.recipe }}"}
      - run: brew test "sass/sass/$RECIPE"
        env: {RECIPE: "${{ matrix.recipe }}"}
      - run: brew uninstall "sass/sass/$RECIPE"
        env: {RECIPE: "${{ matrix.recipe }}"}

  analyze_ci:
    name: Static analysis (GitHub Actions)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: {persist-credentials: false}
    - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
      with:
        persona: pedantic
        advanced-security: false # Fail the GitHub action if Zizmor has findings
